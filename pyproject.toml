[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-org-health"
version = "0.1.0"
description = "Live org-health dashboard — real GitHub CI/security, Hugging Face Space health, and DNS/email-auth posture. Honest UNKNOWN over fabricated green."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Stephen Lutar", email = "stephen@szlholdings.com" }]
dependencies = ["dnspython==2.9.0 \\"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-org-health"

[tool.setuptools]
packages = ["autonomic", "census"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "node_modules"]

[tool.pytest.ini_options]
minversion = "7.0"
