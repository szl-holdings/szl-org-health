name: Open Wave 1 bot-authored source PR

on:
  push:
    branches: [wave1/dynamic-estate-census]
    paths:
      - ".github/workflows/open-wave1-bot-pr.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    if: github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BASE: 5dff5fa582d25709bfa2d4a9bfa0f852fe3e42bc
      EXPECTED_HEAD: 05ac64fde6d4965f3facd0593f4cae565d94af41
      BOT_BRANCH: automation/wave1-dynamic-estate-census-source
      ADMIN_TOKEN: ${{ secrets.SZL_GITHUB_TOKEN }}
    steps:
      - name: Verify exact bot branch and source-only diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BOT_BRANCH}" --jq '.object.sha')
          test "$actual" = "$EXPECTED_HEAD"
          compare=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_BASE}...${EXPECTED_HEAD}")
          test "$(jq -r '.status' <<<"$compare")" = "ahead"
          test "$(jq -r '.ahead_by' <<<"$compare")" = "1"
          test "$(jq -r '.behind_by' <<<"$compare")" = "0"
          changed=$(jq -r '.files[].filename' <<<"$compare" | sort)
          expected=$(printf '%s\n' \
            README.md \
            app.py \
            census/__init__.py \
            census/common.py \
            census/github.py \
            census/huggingface.py \
            census/report.py \
            census/sites.py \
            static/index.html \
            tests/test_census.py | sort)
          test "$changed" = "$expected"

      - name: Read current Actions workflow permissions
        id: current
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/permissions/workflow")
          default_permission=$(jq -r '.default_workflow_permissions' <<<"$response")
          can_approve=$(jq -r '.can_approve_pull_request_reviews' <<<"$response")
          case "$default_permission" in read|write) ;; *) exit 1 ;; esac
          case "$can_approve" in true|false) ;; *) exit 1 ;; esac
          echo "default_permission=$default_permission" >> "$GITHUB_OUTPUT"
          echo "can_approve=$can_approve" >> "$GITHUB_OUTPUT"

      - name: Temporarily permit GitHub Actions PR creation
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" \
            -d "$(jq -nc --arg p '${{ steps.current.outputs.default_permission }}' '{default_workflow_permissions:$p,can_approve_pull_request_reviews:true}')"

      - name: Open the independently authored source PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BOT_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Bot-authored PR already exists: #$existing"
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BOT_BRANCH" \
            --base main \
            --title "feat(census): discover the full GitHub and Hugging Face estates" \
            --body-file - <<'EOF'
          ## Purpose

          Replace the partial hardcoded org-health lists with a live, bounded, revision-aware census for the complete GitHub and Hugging Face estates.

          ## Independent source authorship

          This PR and its single source commit are authored by `github-actions[bot]`. Staging PR #4 validated the exact readable source twice—on the staging tree and on a clean checkout of protected `main`—before creating this branch. Temporary staging workflows and files are excluded.

          ## Capabilities

          - all visible `szl-holdings` repositories through bounded pagination;
          - latest run per workflow, archive/visibility/default branch, branch-protection readability, open PR/issues, and security counts;
          - `SZLHOLDINGS` models, datasets, Spaces, collections, and buckets with exact revisions;
          - observed model-weight evidence, Space runtime/hardware/root probes, and governed flagship health probes;
          - explicit `UNKNOWN` semantics per source and asset class;
          - escaped, searchable, responsive mobile interface;
          - preserved legacy DNS truth contracts and static snapshot compatibility.

          ## Verified exact head

          - base: `5dff5fa582d25709bfa2d4a9bfa0f852fe3e42bc`
          - head: `05ac64fde6d4965f3facd0593f4cae565d94af41`
          - one commit ahead, zero behind, exactly ten source files
          - Python compilation, 16 old-plus-new tests, dashboard JavaScript syntax, pinned container build, and exact schema-v2 `/healthz` passed on a clean protected-base worktree.

          The production CI workflow upgrade will be added as a separate, disclosed commit on this bot-authored PR and must pass before merge.

          Refs #3 and staging PR #4.
          EOF

      - name: Restore exact Actions workflow permissions
        if: always() && steps.current.outcome == 'success'
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" \
            -d "$(jq -nc --arg p '${{ steps.current.outputs.default_permission }}' --argjson a '${{ steps.current.outputs.can_approve }}' '{default_workflow_permissions:$p,can_approve_pull_request_reviews:$a}')"
