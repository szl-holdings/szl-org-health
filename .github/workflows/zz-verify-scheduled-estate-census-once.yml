# SPDX-License-Identifier: Apache-2.0
name: Verify repaired scheduled estate census once

on:
  push:
    branches:
      - ops/verify-scheduled-estate-census-20260904
    paths:
      - .github/workflows/zz-verify-scheduled-estate-census-once.yml

permissions:
  contents: write

concurrency:
  group: verify-scheduled-estate-census-once
  cancel-in-progress: false

jobs:
  census:
    name: census / current-main credential and receipt proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/verify-scheduled-estate-census-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Require branch to descend from current protected main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Mint short-lived organization reader
        id: org-reader
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: szl-holdings
          permission-contents: read

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked runtime dependencies
        run: python -m pip install --no-cache-dir --require-hashes -r requirements.txt

      - name: Collect live estate census
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.org-reader.outputs.token || secrets.DOCS_AUTOMATION_TEAM_READ_TOKEN || github.token }}
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
          REFRESH_DEADLINE_S: "600"
        run: python -I -B refresh_snapshot.py

      - name: Build and enforce census receipt
        id: gate
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          EXPECTED_GITHUB_REPOSITORIES_MINIMUM: "63"
          HAS_CROSS_REPO_GITHUB_TOKEN: ${{ steps.org-reader.outputs.token != '' || secrets.DOCS_AUTOMATION_TEAM_READ_TOKEN != '' }}
          HAS_HF_TOKEN: ${{ secrets.HF_ORG_TOKEN != '' || secrets.HF_WRITE_TOKEN != '' || secrets.HF_TOKEN != '' || secrets.HUGGINGFACE_TOKEN != '' || secrets.HUGGING_FACE_HUB_TOKEN != '' }}
          RECEIPT_REPOSITORY: ${{ github.repository }}
          RECEIPT_RUN_ATTEMPT: ${{ github.run_attempt }}
          RECEIPT_RUN_ID: ${{ github.run_id }}
          RECEIPT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECEIPT_WORKFLOW_SHA: ${{ github.sha }}
        run: python -I -B census/receipt.py --snapshot census-internal.json

      - name: Remove internal census evidence
        if: always()
        run: rm -f -- census-internal.json

      - name: Retain public snapshot and sanitized receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repaired-estate-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            static/data.json
            census-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot verifier after success
        if: success()
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-verify-scheduled-estate-census-once.yml
          git config user.name "SZL Census Verification Controller"
          git config user.email "stephenlutar2@gmail.com"
          git commit \
            -m "chore(census): remove successful one-shot verifier" \
            -m "The repaired scheduled census completed against current main with its sanitized receipt retained as a workflow artifact." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:ops/verify-scheduled-estate-census-20260904
