name: Estate v10 control-plane gate

on:
  pull_request:
    paths:
      - "execution/estate-v10/**"
      - "tools/estate_v10_gate.py"
      - ".github/workflows/estate-v10-control-plane.yml"
  push:
    branches:
      - main
    paths:
      - "execution/estate-v10/**"
      - "tools/estate_v10_gate.py"
      - ".github/workflows/estate-v10-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-v10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate fail-closed execution ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Compile validator
        run: python -m py_compile tools/estate_v10_gate.py

      - name: Run negative-path self-test
        run: python tools/estate_v10_gate.py --self-test

      - name: Validate execution state
        run: python tools/estate_v10_gate.py --state execution/estate-v10/EXECUTION_STATE.json

      - name: Validate program contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Never force-merge" execution/estate-v10/EXECUTION.md
          grep -Fq "Migrate, prove parity, then archive" execution/estate-v10/EXECUTION.md
          grep -Fq "SUPPORTED -> PRODUCTION" execution/estate-v10/EXECUTION.md
          grep -Fq "szl-kernels" execution/estate-v10/EXECUTION.md
          grep -Fq "szl-forge" execution/estate-v10/EXECUTION.md
          grep -Fq "a11oy-net" execution/estate-v10/EXECUTION.md
