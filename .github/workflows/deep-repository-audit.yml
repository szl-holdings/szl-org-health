name: Deep repository audit contracts

on:
  pull_request:
    paths:
      - census/deep_repository_audit.py
      - census/deep_repository_audit_v2.py
      - tests/test_deep_repository_audit.py
      - tests/test_deep_repository_audit_v2.py
      - docs/DEEP_REPOSITORY_AUDIT.md
      - .github/workflows/deep-repository-audit.yml
      - .github/workflows/scheduled-estate-census.yml
  push:
    branches: [main]
    paths:
      - census/deep_repository_audit.py
      - census/deep_repository_audit_v2.py
      - tests/test_deep_repository_audit.py
      - tests/test_deep_repository_audit_v2.py
      - docs/DEEP_REPOSITORY_AUDIT.md
      - .github/workflows/deep-repository-audit.yml
      - .github/workflows/scheduled-estate-census.yml

permissions:
  contents: read

concurrency:
  group: deep-repository-audit-contract-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: Offline deep-audit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and prove fail-closed contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            census/deep_repository_audit.py \
            census/deep_repository_audit_v2.py \
            tests/test_deep_repository_audit.py \
            tests/test_deep_repository_audit_v2.py
          python -m unittest discover -s tests -p 'test_deep_repository_audit*.py' -v
          git diff --check
