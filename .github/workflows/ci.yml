name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  truth-contract:
    name: DNS and health truth contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Compile readable collectors
        run: python -m py_compile app.py refresh_snapshot.py census/*.py
      - name: Run fail-closed census contracts
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/org-health-dashboard.js').write_text(script)
          PY
          node --check /tmp/org-health-dashboard.js
      - name: Build staging runtime image
        run: docker build --tag szl-org-health-staging .
      - name: Prove schema-v2 liveness inside the image
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 17860:7860 szl-org-health-staging)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17860/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/healthz.json').read_text())
          expected = {'status': 'ok', 'service': 'szl-org-health', 'schema_version': 2}
          assert payload == expected, payload
          PY

  stage-wave1-census:
    name: Stage independently authored Wave 1 census
    needs: truth-contract
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'wave1/dynamic-estate-census' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_BRANCH: automation/wave1-dynamic-estate-census
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact staging head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact protected base for bot commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: work
          fetch-depth: 1
      - name: Verify source hashes and exact staging scope
        run: |
          set -euo pipefail
          (cd candidate && sha256sum --check --strict .wave1/manifest.sha256)
          changed=$(git -C candidate diff --name-only "$BASE_SHA" HEAD | sort)
          expected=$(printf '%s\n' \
            .github/workflows/ci.yml \
            .wave1/ci.production.yml \
            .wave1/manifest.sha256 \
            README.md \
            app.py \
            census/__init__.py \
            census/common.py \
            census/github.py \
            census/huggingface.py \
            census/report.py \
            census/sites.py \
            static/index.html \
            tests/test_census.py | sort)
          test "$changed" = "$expected"
          test -z "$(find candidate/census candidate/.wave1 -type l -print -quit)"
      - name: Copy only manifest-approved production files
        run: |
          set -euo pipefail
          mkdir -p work/census work/static work/tests work/.github/workflows
          cp candidate/app.py work/app.py
          cp candidate/README.md work/README.md
          cp candidate/census/*.py work/census/
          cp candidate/static/index.html work/static/index.html
          cp candidate/tests/test_census.py work/tests/test_census.py
          cp candidate/.wave1/ci.production.yml work/.github/workflows/ci.yml
      - name: Re-run contracts in clean protected-base worktree
        working-directory: work
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements.txt
          python -m py_compile app.py refresh_snapshot.py census/*.py
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/org-health-bot-dashboard.js').write_text(script)
          PY
          node --check /tmp/org-health-bot-dashboard.js
          docker build --tag szl-org-health-bot .
          cid=$(docker run -d -p 17861:7860 szl-org-health-bot)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17861/healthz > /tmp/bot-healthz.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/bot-healthz.json').read_text())
          expected = {'status': 'ok', 'service': 'szl-org-health', 'schema_version': 2}
          assert payload == expected, payload
          PY
      - name: Create one DCO-valid GitHub Actions bot commit
        working-directory: work
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git switch -C "$BOT_BRANCH"
          git add \
            .github/workflows/ci.yml \
            README.md \
            app.py \
            census/__init__.py \
            census/common.py \
            census/github.py \
            census/huggingface.py \
            census/report.py \
            census/sites.py \
            static/index.html \
            tests/test_census.py
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/ci.yml \
            README.md \
            app.py \
            census/__init__.py \
            census/common.py \
            census/github.py \
            census/huggingface.py \
            census/report.py \
            census/sites.py \
            static/index.html \
            tests/test_census.py | sort)
          test "$changed" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "feat(census): discover the full GitHub and Hugging Face estates" \
            -m "Replace partial hardcoded lists with bounded, revision-aware discovery for repositories, models, datasets, Spaces, collections, and buckets. Preserve explicit UNKNOWN semantics, latest-per-workflow CI, mobile search, and fail-closed evidence contracts." \
            -m "Refs szl-org-health#3" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "$BOT_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$BOT_BRANCH:refs/remotes/origin/$BOT_BRANCH"
            old_remote=$(git rev-parse "refs/remotes/origin/$BOT_BRANCH")
            git push --force-with-lease="refs/heads/$BOT_BRANCH:$old_remote" origin "HEAD:refs/heads/$BOT_BRANCH"
          else
            git push origin "HEAD:refs/heads/$BOT_BRANCH"
          fi
