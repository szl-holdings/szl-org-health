name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  truth-contract:
    name: DNS and health truth contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v6.0.0
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile app.py refresh_snapshot.py
      - name: Run truth-contract tests
        run: python -m unittest discover -s tests -v
