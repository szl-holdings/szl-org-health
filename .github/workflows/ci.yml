name: Estate census CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: estate-census-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Compile collectors
        run: python -m py_compile app.py refresh_snapshot.py census/*.py
      - name: Run fail-closed census contracts
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/org-health-dashboard.js').write_text(script)
          PY
          node --check /tmp/org-health-dashboard.js

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned container
        run: docker build -t szl-org-health:test .
      - name: Prove service liveness contract
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 17860:7860 szl-org-health:test)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker image inspect --format '{{.Config.User}}' szl-org-health:test)" = "65532:65532"
          test "$(docker exec "$cid" id -u)" != "0"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17860/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/healthz.json').read_text())
          assert payload == {'status': 'ok', 'service': 'szl-org-health', 'schema_version': 2}, payload
          PY
