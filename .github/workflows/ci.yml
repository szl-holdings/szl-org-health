name: Estate census CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: estate-census-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Compile collectors, autonomic controller, and diligence compiler
        run: python -m compileall -q app.py refresh_snapshot.py build_series_a_diligence.py census autonomic scripts
      - name: Check diligence policy and schema document JSON syntax
        run: |
          python -m json.tool diligence/policy.json >/dev/null
          python -m json.tool schemas/series-a-diligence.schema.json >/dev/null
      - name: Run fail-closed census and recovery contracts
        run: python -m unittest discover -s tests -v
      - name: Compile a source-bound packet and reproduce its historical bytes
        run: |
          python -I -B build_series_a_diligence.py \
            --input static/data.json \
            --source-revision "$(git rev-parse HEAD)" \
            --output /tmp/series-a-diligence.json \
            --markdown /tmp/SERIES_A_DILIGENCE.generated.md \
            --require-source-bound
          python - <<'PY'
          import subprocess
          from pathlib import Path

          from census.diligence import strict_load_json, validate_artifact

          artifact = strict_load_json(Path('/tmp/series-a-diligence.json'))
          head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          binding = artifact['source_binding']
          assert binding['compiler_revision'] == head, binding
          assert binding['compiler_revision_verified'] is True, binding
          assert binding['state'] == 'MEASURED', binding
          source = artifact['requirements']['compiler_source']
          assert source['state'] == 'MEASURED', source
          # static/data.json has no matching sanitized receipt in this repo.
          # Preserve the gap; never manufacture a public-byte binding in CI.
          public_binding = artifact['public_snapshot_binding']
          assert public_binding['state'] == 'UNAVAILABLE', public_binding
          receipt_requirement = artifact['requirements']['public_snapshot_receipt']
          assert receipt_requirement['state'] == 'UNAVAILABLE', receipt_requirement
          assert any(
              gap['requirement'] == 'public_snapshot_receipt'
              for gap in artifact['gaps']
          ), artifact['gaps']
          errors = validate_artifact(artifact)
          assert errors == [], errors
          PY
          python -I -B build_series_a_diligence.py \
            --input static/data.json \
            --source-revision "$(git rev-parse HEAD)" \
            --output /tmp/series-a-diligence.json \
            --markdown /tmp/SERIES_A_DILIGENCE.generated.md \
            --check --historical-check \
            --require-source-bound
      - name: Execute public Draft 2020-12 diligence schema contract
        run: |
          python -I -B scripts/verify_series_a_schema_contract.py \
            --schema schemas/series-a-diligence.schema.json \
            --artifact /tmp/series-a-diligence.json
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/org-health-dashboard.js').write_text(script)
          PY
          node --check /tmp/org-health-dashboard.js

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned container
        run: docker build -t szl-org-health:test .
      - name: Prove service liveness contract
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 17860:7860 szl-org-health:test)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          test "$(docker image inspect --format '{{.Config.User}}' szl-org-health:test)" = "65532:65532"
          test "$(docker exec "$cid" id -u)" != "0"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17860/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/healthz.json').read_text())
          assert payload == {'status': 'ok', 'service': 'szl-org-health', 'schema_version': 2}, payload
          PY
