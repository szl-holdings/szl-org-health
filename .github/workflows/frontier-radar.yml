name: Open-source frontier radar

on:
  pull_request:
    paths:
      - census/frontier_radar.py
      - tests/test_frontier_radar.py
      - docs/OPEN_SOURCE_FRONTIER_RADAR.md
      - .github/workflows/frontier-radar.yml
  push:
    branches: [main]
    paths:
      - census/frontier_radar.py
      - tests/test_frontier_radar.py
      - docs/OPEN_SOURCE_FRONTIER_RADAR.md
      - .github/workflows/frontier-radar.yml
  workflow_run:
    workflows:
      - Scheduled estate census
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: frontier-radar-${{ github.event.workflow_run.id || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Offline frontier-radar contracts
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and prove adoption boundaries
        run: |
          set -euo pipefail
          python -m py_compile census/frontier_radar.py tests/test_frontier_radar.py
          python -m unittest discover -s tests -p 'test_frontier_radar.py' -v
          git diff --check

  scheduled-radar:
    name: Resolve official upstreams against verified estate evidence
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the exact scheduled source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact deep-audit artifact from the triggering run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-repository-audit-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: upstream-audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve exact upstream releases and compare estate capabilities
        id: radar
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          technology_index="$(find upstream-audit -type f -name technology-capability-index.json -print -quit)"
          test -n "$technology_index" || {
            echo "::error::The triggering audit exposed no verified technology capability index."
            exit 2
          }
          python -I -B census/frontier_radar.py \
            --technology-index "$technology_index" \
            --output-dir frontier-radar

      - name: Upload immutable frontier radar evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-source-frontier-radar-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: frontier-radar/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce complete upstream evidence
        if: always()
        env:
          RADAR_OUTCOME: ${{ steps.radar.outcome }}
        run: |
          test "$RADAR_OUTCOME" = success || {
            echo "::error::The official-upstream frontier radar was incomplete."
            exit 2
          }
