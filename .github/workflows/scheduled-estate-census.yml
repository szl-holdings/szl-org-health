name: Scheduled estate census

on:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-estate-census
  cancel-in-progress: false

jobs:
  census:
    name: census / fail-closed evidence
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify default-branch checkout subject
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mint short-lived organization reader
        id: org-reader
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: szl-holdings
          permission-contents: read

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked runtime dependencies
        run: python -m pip install --no-cache-dir --require-hashes -r requirements.txt

      - name: Collect live estate census
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.org-reader.outputs.token || secrets.DOCS_AUTOMATION_TEAM_READ_TOKEN || github.token }}
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
          REFRESH_DEADLINE_S: "600"
        run: python -I -B refresh_snapshot.py

      - name: Build and enforce census receipt
        id: gate
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          EXPECTED_GITHUB_REPOSITORIES_MINIMUM: "63"
          HAS_CROSS_REPO_GITHUB_TOKEN: ${{ steps.org-reader.outputs.token != '' || secrets.DOCS_AUTOMATION_TEAM_READ_TOKEN != '' }}
          HAS_HF_TOKEN: ${{ secrets.HF_ORG_TOKEN != '' || secrets.HF_WRITE_TOKEN != '' || secrets.HF_TOKEN != '' || secrets.HUGGINGFACE_TOKEN != '' || secrets.HUGGING_FACE_HUB_TOKEN != '' }}
          RECEIPT_REPOSITORY: ${{ github.repository }}
          RECEIPT_RUN_ATTEMPT: ${{ github.run_attempt }}
          RECEIPT_RUN_ID: ${{ github.run_id }}
          RECEIPT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECEIPT_WORKFLOW_SHA: ${{ github.sha }}
        run: python -I -B census/receipt.py --snapshot census-internal.json

      - name: Remove internal census evidence
        if: always()
        run: rm -f -- census-internal.json

      - name: Retain public snapshot and sanitized receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: estate-census-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            static/data.json
            census-receipt.json
          if-no-files-found: error
          retention-days: 30

  deep-audit:
    name: deep audit / shard ${{ matrix.shard }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify default-branch checkout subject
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mint short-lived organization audit reader
        id: org-reader
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.QILLQAQ_CLIENT_ID }}
          private-key: ${{ secrets.QILLQAQ_PRIVATE_KEY }}
          owner: szl-holdings
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Inventory and verify every tracked file in this shard
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.org-reader.outputs.token || secrets.DOCS_AUTOMATION_TEAM_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -n "${GITHUB_TOKEN:-}" || {
            echo "::error::No organization-readable GitHub token is available."
            exit 2
          }
          python -I -B census/deep_repository_audit.py shard \
            --org szl-holdings \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 6 \
            --output-dir "deep-audit-shard-${{ matrix.shard }}"

      - name: Upload immutable shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-audit-shard-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: deep-audit-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Fail closed on incomplete shard collection
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          test "$COLLECT_OUTCOME" = success || {
            echo "::error::Shard collection was incomplete."
            exit 2
          }

  deep-audit-merge:
    name: deep audit / merge and verify
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [deep-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download all exact shard receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deep-audit-shard-*-${{ github.sha }}-${{ github.run_attempt }}
          path: deep-audit-shards
          merge-multiple: true

      - name: Verify complete coverage and build final evidence
        id: merge
        continue-on-error: true
        run: |
          set -euo pipefail
          python -I -B census/deep_repository_audit.py merge \
            --org szl-holdings \
            --shard-count 6 \
            --input-dir deep-audit-shards \
            --output-dir deep-audit-final

      - name: Upload final organization audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-repository-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            deep-audit-final/
            deep-audit-shards/file-inventory-shard-*.ndjson.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce complete merged evidence
        if: always()
        env:
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          test "$MERGE_OUTCOME" = success || {
            echo "::error::Final audit evidence is incomplete or internally inconsistent."
            exit 2
          }
