name: Autonomic public-estate SLO

on:
  schedule:
    # Each run collects three real five-minute samples within a bounded batch.
    - cron: "2-59/15 * * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: autonomic-public-estate-slo
  cancel-in-progress: false

jobs:
  observe:
    name: Measure, budget, deadman, incident, and receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact scheduled default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact schedule authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-prove the observational authority boundary
        run: |
          set -euo pipefail
          python -m py_compile autonomic/slo_controller.py autonomic/slo_evidence.py autonomic/slo_sampling.py
          python -m unittest tests.test_autonomic_slo tests.test_slo_workflow_evidence tests.test_slo_state_codec tests.test_slo_sampling -v
          python -m autonomic.slo_controller \
            --offline-contract-only \
            --output reports/autonomic-slo-contract.json
          git diff --check

      - name: Run the independent SLO controller
        id: slo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python -m autonomic.slo_sampling \
            --output-dir reports/autonomic-slo-samples
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable SLO evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomic-slo-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/autonomic-slo-contract.json
            reports/autonomic-slo-samples/
          if-no-files-found: error
          retention-days: 90

      - name: Preserve the reliability verdict as workflow evidence
        if: always()
        shell: bash
        env:
          SLO_EXIT_CODE: ${{ steps.slo.outputs.exit_code || '1' }}
        run: |
          set -euo pipefail
          python -m autonomic.slo_sampling --verify-only \
            --output-dir reports/autonomic-slo-samples \
            --exit-code "$SLO_EXIT_CODE" \
            --summary "$GITHUB_STEP_SUMMARY"
