name: Autonomic public-estate SRE

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomic-public-estate-sre
  cancel-in-progress: false

jobs:
  live:
    name: Sense, decide, recover, verify, and receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact scheduled default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require exact verified schedule authority
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autonomic.lock

      - name: Re-prove source, authority, and schedule contracts before mutation
        run: |
          set -euo pipefail
          python -m py_compile autonomic/*.py tests/test_autonomic_controller*.py
          python -m unittest \
            tests.test_autonomic_controller \
            tests.test_autonomic_controller_v2 \
            tests.test_secret_workflow_boundary \
            -v
          python -m autonomic.controller_v2 \
            --offline-contract-only \
            --output reports/autonomic-sre-contract.json
          git diff --check

      - name: Install exact Hugging Face control dependency closure
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement requirements-autonomic.lock
          python -m pip check

      - name: Run the closed-loop controller v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          HF_WRITE_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m autonomic.controller_v2 \
            --output reports/autonomic-sre.json

      - name: Write operator summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("reports/autonomic-sre.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as stream:
              stream.write("# SZL Autonomic SRE v2\n\n")
              if not report_path.exists():
                  stream.write("Controller receipt was not produced.\n")
                  raise SystemExit(0)
              report = json.loads(report_path.read_text(encoding="utf-8"))
              stream.write(
                  f"- Controller: `{report.get('controller_schema', 'UNAVAILABLE')}`\n"
              )
              stream.write(f"- All healthy: `{report.get('all_healthy', False)}`\n")
              stream.write(
                  f"- Healthy surfaces: `{report.get('healthy_surface_count', 0)}/"
                  f"{report.get('public_surface_count', 0)}`\n"
              )
              stream.write(
                  f"- Provider mutations attempted: "
                  f"`{report.get('attempted_mutation_count', 0)}`\n"
              )
              stream.write(
                  f"- HF authority source: "
                  f"`{report.get('hf_token_source_name', 'UNAVAILABLE')}`\n"
              )
              stream.write(
                  f"- Manifest revision: `{report.get('manifest_revision', 'UNAVAILABLE')}`\n"
              )
              stream.write(
                  f"- Receipt SHA-256: `{report.get('receipt_sha256', 'UNAVAILABLE')}`\n\n"
              )
              stream.write("| Surface | State | HF stage | Availability | Source | Evidence | Action |\n")
              stream.write("|---|---|---|---:|---|---|---|\n")
              for row in report.get("surfaces", []):
                  stream.write(
                      f"| {row.get('id')} | {row.get('state_after')} | "
                      f"{row.get('hf_stage')} | {row.get('availability_ok')} | "
                      f"{row.get('source_status')} | {row.get('source_evidence')} | "
                      f"{row.get('planned_action') or '—'} |\n"
                  )
          PY

      - name: Upload immutable cycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomic-sre-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/autonomic-sre-contract.json
            reports/autonomic-sre.json
            reports/autonomic-sre.json.sha256
          if-no-files-found: error
          retention-days: 90
