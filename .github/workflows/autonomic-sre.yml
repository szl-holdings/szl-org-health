name: Autonomic public-estate SRE

on:
  pull_request:
    paths:
      - "autonomic/**"
      - "tests/test_autonomic_controller.py"
      - "requirements-autonomic.lock"
      - ".github/workflows/autonomic-sre.yml"
      - ".github/workflows/ci.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "autonomic/**"
      - "tests/test_autonomic_controller.py"
      - "requirements-autonomic.lock"
      - ".github/workflows/autonomic-sre.yml"
      - ".github/workflows/ci.yml"
      - "README.md"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Probe and plan without changing Space runtime or durable state
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: autonomic-public-estate-sre
  cancel-in-progress: false

jobs:
  contract:
    name: Fail-closed autonomic contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate controller, policy, and adversarial state transitions
        run: |
          set -euo pipefail
          python -m py_compile autonomic/*.py tests/test_autonomic_controller.py
          python -m unittest tests.test_autonomic_controller -v
          python -m autonomic.controller \
            --offline-contract-only \
            --output reports/autonomic-sre-contract.json
          git diff --check

      - name: Upload contract receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomic-sre-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/autonomic-sre-contract.json
          if-no-files-found: error
          retention-days: 90

  live:
    name: Sense, decide, recover, verify, and receipt
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact protected main event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Require the scheduled run to own the exact main tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --porcelain)" = ""

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autonomic.lock

      - name: Install exact Hugging Face control dependency closure
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --requirement requirements-autonomic.lock
          python -m pip check

      - name: Run the closed-loop controller
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m autonomic.controller \
            --output reports/autonomic-sre.json \
            "${args[@]}"

      - name: Write operator summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("reports/autonomic-sre.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as stream:
              stream.write("# SZL Autonomic SRE\n\n")
              if not report_path.exists():
                  stream.write("Controller receipt was not produced.\n")
                  raise SystemExit(0)
              report = json.loads(report_path.read_text(encoding="utf-8"))
              stream.write(f"- All healthy: `{report.get('all_healthy', False)}`\n")
              stream.write(
                  f"- Healthy surfaces: `{report.get('healthy_surface_count', 0)}/"
                  f"{report.get('public_surface_count', 0)}`\n"
              )
              stream.write(f"- Recovery actions: `{len(report.get('actions', []))}`\n")
              stream.write(
                  f"- Manifest revision: `{report.get('manifest_revision', 'UNAVAILABLE')}`\n"
              )
              stream.write(
                  f"- Receipt SHA-256: `{report.get('receipt_sha256', 'UNAVAILABLE')}`\n\n"
              )
              stream.write("| Surface | State | HF stage | Availability | Source | Action |\n")
              stream.write("|---|---|---|---:|---|---|\n")
              for row in report.get("surfaces", []):
                  stream.write(
                      f"| {row.get('id')} | {row.get('state_after')} | "
                      f"{row.get('hf_stage')} | {row.get('availability_ok')} | "
                      f"{row.get('source_status')} | {row.get('planned_action') or '—'} |\n"
                  )
          PY

      - name: Upload immutable cycle receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autonomic-sre-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/autonomic-sre.json
            reports/autonomic-sre.json.sha256
          if-no-files-found: error
          retention-days: 90
