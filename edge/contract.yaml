not_covered:
  - target: "api.a-11-oy.com, gateway.a-11-oy.com, meter.a-11-oy.com, gpu2.a-11-oy.com"
    reason: "On the owner's chargeable-host list, but no enabled rule targets them except the zone-wide /v1/chat/ rule; the per-host contract is an open owner decision (MONETIZATION_REPORT G-03, THREAD_AUDIT C-37). run5.log: gateway 502, gpu2 403 Cloudflare Access."
  - target: "gpu.a-11-oy.com, meter2.a-11-oy.com, gpu-cloud.a-11-oy.com"
    reason: "Not covered by any owner decision. Latent exposure without an Access app (MONETIZATION_REPORT G-02; CLOUDFLARE_REPORT 17:05Z): gpu 502 and meter2 403 in run5.log."
  - target: "a-11-oy.com /llms.txt, /favicon.ico, /.well-known/x402-pricing.json, /.webmcp/bridge.js"
    reason: "Listed free in MONETIZATION_REPORT 4.5.1, but no evidence that the origin serves them; add each once a live run shows it is served."
  - target: "/v1/chat/ on hosts other than inference."
    reason: "Rule 41cee0f8 has no host condition, so it also charges /v1/chat/ on the apex website and every other a-11-oy.com host; the contract probes the inference host only (MONETIZATION_REPORT 4.3 R1 scopes the rule to inference)."
  - target: "verified-bot-only rules, enabled or disabled"
    reason: "An unverified runner is never charged by a cf.client.bot rule, so re-enabling one (for example the $0.10 catch-all 5303c2e1 or the a11oy.net $1.00 rule 56a20485) does not turn these checks red. The szl-estate-os Cloudflare drift check covers rule enabled flags."
  - target: "showcase.a-11-oy.com, dev.a-11-oy.com, szlholdings.com"
    reason: "showcase gave no response in run3.log; dev. is DNS-only GitHub Pages (no Cloudflare paywall can apply); szlholdings.com is pending its nameserver switch."
  - target: "mcp.a-11-oy.com /mcp transport"
    reason: "No enabled paywall rule (e610a927 and 2dac25fc are disabled); hatun-mcp answers 401 operator_key_required to anonymous calls. Not a paywall surface today."
  - target: "gdw.a-11-oy.com /"
    reason: "Removed from checks on 2026-11-14: the gdw-frontier Space was folded private (a11oy #3420) and the DNS-only hostname now answers 404, so the old origin-authentication outcome is gone; re-add a check only when the fold is reversed or the hostname is repointed."
