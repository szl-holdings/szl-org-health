# SPDX-License-Identifier: Apache-2.0
#
# Edge contract (C-33): what an UNPAID, unauthenticated client must receive
# from the Cloudflare edge in front of the SZL estate. Checked every six hours
# from a GitHub-hosted runner by .github/workflows/edge-contract.yml, using
# edge/check_contract.py. Semantics, the outcome labels and the proof boundary
# are documented in docs/EDGE_CONTRACT.md.
#
#   free      2xx, 3xx, or an origin authentication refusal (401/403). Never 402.
#   paid      402 with an x402 v2 PAYMENT-REQUIRED header whose decoded amount,
#             scheme, network, asset, payTo and resource URL equal the live rule.
#   internal  403 that is not a bot challenge.
#
# Seeded on 2026-11-06 from the coordinator's read-only evidence:
#   - the live Monetization Gateway rules (_cf/monetization_rules_1650.json)
#     with the three rules the coordinator disabled at 16:27:21-25Z applied
#     (_cf/monetization_changes_1655.json, each PATCH returned HTTP 200);
#   - Cloudflare URL Scanner runs before (_cf/scans/run3.log) and after
#     (_cf/scans/run4.log) that change, plus earlier runs where cited;
#   - WAF custom rules and redirect rules (_cf/inspect_1610.json, _cf/cf_audit.json);
#   - the owner's paywall decision and MONETIZATION_REPORT section 4.5.
# This file restricts the YAML it accepts: see "Contract format" in
# docs/EDGE_CONTRACT.md. Quote every value that is not a simple word, path,
# hostname or integer.

schema: szl.edge-contract/v1
as_of: "2026-11-14"
owner_decision: "2026-11-06 paywall decision: charge API/MCP hosts only; websites, /pricing, the proof site, health and /.well-known paths stay free."

sources:
  live_rules: "Monetization Gateway rules read at about 16:26Z (_cf/monetization_rules_1650.json), with the three 16:27Z disables (_cf/monetization_changes_1655.json) applied"
  scans_before: "_cf/scans/run3.log (URL Scanner, before the 16:27Z change)"
  scans_after: "_cf/scans/run4.log (URL Scanner, after the 16:27Z change)"
  waf: "WAF custom rules in _cf/inspect_1610.json (16:10Z); redirect rules in _cf/cf_audit.json (15:06Z)"
  verify_plan: "MONETIZATION_REPORT.md section 4.5 (free paths, paid-path header fields, blocked paths)"
  edge_skip_rules_20261114: "SBFM/free-surface skip rules added 2026-11-14 21:24Z after the 20:31Z Edge contract run showed bot challenges on free surfaces: a-11-oy.com 93a4cb3f7cb140cfa84dffba09e22903 (apex /pricing), 507acb2bd2a34fe9bc4cffb24d5585d3 (holdings), 3740ff2c9aee47e5a8ebfc1584a5bbe1 (inference internals so the WAF block serves); a11oy.net 017fd36759d744d8a3aa93db91e03d01 (proof-site free paths), 370eb290ee0245649f0c1f396bd732fa (ntfy). Verified 200 from the owner device after the rules landed."

unpaid_client:
  # The live rules exempt any User-Agent containing one of these substrings
  # (each rule expression ends with "and not (http.user_agent contains ...)").
  # The probe must never send one of them, or the paywall would not apply.
  user_agent: "szl-edge-contract/1 (+https://github.com/szl-holdings/szl-org-health)"
  exempt_user_agent_substrings:
    - szl-readiness
    - szl-mesh-orchestrator
    - szl-energy-operator
    - SZL-Estate-Release-Train
    - SZL-Vigil-Anatomy-Probe
    - Cloudflare-Healthchecks
  timeout_seconds: 15
  max_body_bytes: 65536
  # An unpaid POST must never start a generation if it leaks past the paywall:
  # "{}" fails the OpenAI-compatible request validators (no model, no prompt).
  post_body: "{}"
  post_content_type: application/json

payment_terms:
  # Decoded PAYMENT-REQUIRED header of the live gateway 402 on
  # GET https://inference.a-11-oy.com/v1/completions: x402Version 2,
  # scheme exact, network eip155:8453 (Base), asset USDC, amount 20000.
  # Since 2026-11-13 06:47Z every observed challenge offers the payTo below
  # and a11oy #3409 aligned the GitHub-side x402 pricing to the same address;
  # the 2026-11-06 seed address is superseded.
  x402_version: 2
  scheme: exact
  network: "eip155:8453"
  asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
  pay_to: "0x7b133ef996852c223379d6d1245430300970291A"

# Every rule that is enabled after the 16:27Z change. 13 rules are disabled
